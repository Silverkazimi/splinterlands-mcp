name: fixture-refresh

on:
  schedule:
    - cron: "41 4 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: fixture-refresh
  cancel-in-progress: false

jobs:
  fixture-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/fixture-refresh.ts --publish
        env:
          GH_TOKEN: ${{ github.token }}
          MCP_FIXTURE_INPUTS: ${{ secrets.MCP_FIXTURE_INPUTS }}
          ACCOUNT_SMALL: ${{ secrets.ACCOUNT_SMALL }}
          ACCOUNT_MID: ${{ secrets.ACCOUNT_MID }}
          ACCOUNT_LARGE: ${{ secrets.ACCOUNT_LARGE }}
          ACCOUNT_NONE: ${{ secrets.ACCOUNT_NONE }}
