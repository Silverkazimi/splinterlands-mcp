name: drift-check

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: drift-check
  cancel-in-progress: false

jobs:
  drift-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/drift-check.ts --publish
        env:
          GH_TOKEN: ${{ github.token }}
          MCP_DRIFT_INPUTS: ${{ secrets.MCP_DRIFT_INPUTS }}
          ACCOUNT_SMALL: ${{ secrets.ACCOUNT_SMALL }}
          ACCOUNT_MID: ${{ secrets.ACCOUNT_MID }}
          ACCOUNT_LARGE: ${{ secrets.ACCOUNT_LARGE }}
          ACCOUNT_NONE: ${{ secrets.ACCOUNT_NONE }}
